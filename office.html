<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEJA WEB STUDIO | Private Office</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080808;color:#f5f0e5;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;padding:32px 25px;background:#111;border:1px solid #b99745;border-radius:18px;box-shadow:0 0 35px #b9974520}
.brand{text-align:center;color:#d5b45b;font-size:13px;letter-spacing:4px;font-weight:bold}
h1{text-align:center;font-size:25px;margin:18px 0 8px}
.sub{text-align:center;color:#aaa;font-size:13px;margin-bottom:28px}
label{display:block;margin:15px 0 7px;color:#d5b45b;font-size:13px}
input{width:100%;padding:14px;background:#080808;color:white;border:1px solid #444;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:8px;background:linear-gradient(90deg,#a98532,#e5ca78);color:#111;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.message{text-align:center;font-size:13px;margin-top:17px;line-height:1.6;color:#d5b45b}
.panel{text-align:center;padding:15px 0}
.panel p{color:#bbb;line-height:1.7;font-size:14px}
.logout{background:#292929;color:#eee;border:1px solid #555}
.note{text-align:center;color:#777;font-size:11px;margin-top:22px}
</style>
</head>
<body>
<div class="card">
<div class="brand">TEJA WEB STUDIO</div>

<section id="loginView">
<h1>Owner Login</h1>
<div class="sub">Secure Email OTP Verification</div>

<label>Owner Email</label>
<input id="email" type="email" value="tej633519@gmail.com" readonly>

<button id="sendBtn" onclick="sendOTP()">SEND LOGIN OTP</button>

<div id="otpArea" class="hidden">
<label>6-Digit Email OTP</label>
<input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Enter OTP">
<button id="verifyBtn" onclick="verifyOTP()">VERIFY & LOGIN</button>
</div>
</section>

<section id="dashboardView" class="hidden">
<div class="panel">
<div style="color:#d5b45b;letter-spacing:2px">PRIVATE OFFICE ACCESS</div>
<h1>Welcome, Owner</h1>
<p>Your Owner identity has been verified successfully.</p>
<p>TEJA WEB STUDIO Private Office</p>
<p>Dashboard setup is the next step.</p>
<button class="logout" onclick="logout()">LOG OUT</button>
</div>
</section>

<div id="message" class="message" aria-live="polite"></div>
<div class="note">AUTHORIZED OWNER ACCESS ONLY</div>
</div>

<script>
const SUPABASE_URL="https://beuoolukuulujogvvxac.supabase.co";
const SUPABASE_KEY="sb_publishable_kX4EVyUKzhfEmfk8gW6OEA_2pOGtOsH";
const OWNER_UID="f4bf2cc3-80a1-483e-9ac2-9c867aef1ef3";
const OWNER_EMAIL="tej633519@gmail.com";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function message(text,error=false){
 const el=document.getElementById("message");
 el.textContent=text;
 el.style.color=error?"#ff8585":"#d5b45b";
}

function showDashboard(){
 document.getElementById("loginView").classList.add("hidden");
 document.getElementById("dashboardView").classList.remove("hidden");
 message("Owner login verified.");
}

async function sendOTP(){
 const btn=document.getElementById("sendBtn");
 btn.disabled=true;
 message("Sending OTP to Owner email...");

 const {error}=await db.auth.signInWithOtp({
  email:OWNER_EMAIL,
  options:{shouldCreateUser:false}
 });

 btn.disabled=false;

 if(error){
  message(error.message,true);
  return;
 }

 document.getElementById("otpArea").classList.remove("hidden");
 message("OTP sent. Check your Gmail Inbox and Spam folder.");
}

async function verifyOTP(){
 const otp=document.getElementById("otp").value.trim();

 if(!/^\d{6}$/.test(otp)){
  message("Please enter the valid 6-digit OTP.",true);
  return;
 }

 const btn=document.getElementById("verifyBtn");
 btn.disabled=true;
 message("Verifying OTP...");

 const {data,error}=await db.auth.verifyOtp({
  email:OWNER_EMAIL,
  token:otp,
  type:"email"
 });

 btn.disabled=false;

 if(error){
  message(error.message,true);
  return;
 }

 if(!data.user||data.user.id!==OWNER_UID){
  await db.auth.signOut();
  message("Unauthorized account. Access denied.",true);
  return;
 }

 showDashboard();
}

async function logout(){
 await db.auth.signOut();
 document.getElementById("dashboardView").classList.add("hidden");
 document.getElementById("loginView").classList.remove("hidden");
 document.getElementById("otpArea").classList.add("hidden");
 document.getElementById("otp").value="";
 message("Logged out successfully.");
}

async function initialize(){
 const {data,error}=await db.auth.getSession();

 if(error){
  message(error.message,true);
  return;
 }

 if(data.session){
  if(data.session.user.id===OWNER_UID){
   showDashboard();
  }else{
   await db.auth.signOut();
   message("Unauthorized account.",true);
  }
 }
}

initialize();
</script>
</body>
</html>
